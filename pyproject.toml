[project]
name = "bros"
version = "0.1.0"
description = "Small specialist model for the Bros app. First skill: chat labeling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jasen" }]
dependencies = [
    "accelerate>=1.4.0",
    "datasets>=3.0.0",
    "peft>=0.17.0",
    "sentencepiece>=0.2.0",
    "torch>=2.11.0,<2.12",
    "transformers>=4.56.2",
    "trl>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["training"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
