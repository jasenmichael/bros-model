name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Release when VERSION changed
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          merge="${{ github.event.pull_request.merge_commit_sha }}"
          old="$(git show "${base}:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          new="$(git show "${merge}:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          if [[ -z "$new" || "$old" == "$new" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          tag="$(scripts/release.sh)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          gh release create "$tag" bros-model.tar.gz \
            --target "$merge" \
            --title "$tag" \
            --notes "Packaged model, Modelfile, and install script."

      # v1.0.0 is the first packaged release. Bros 0.0.1 already records it.
      - name: Open Bros pull request
        if: steps.pack.outputs.changed == 'true' && steps.pack.outputs.tag != 'v1.0.0'
        env:
          BROS_REPO_TOKEN: ${{ secrets.BROS_REPO_TOKEN }}
        run: scripts/open-bros-pr.sh "${{ steps.pack.outputs.tag }}"
